[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pasa-sim"
version = "1.0.0"
description = "Pollution-Aware Solar Assessment: a clear-sky / MODIS-MAIAC-pollution-aware direct-beam solar irradiance simulator for 3D city models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pvlib>=0.10",
    "trimesh>=4.0",
    "rtree>=1.2",
    "rasterio>=1.3",
    "netCDF4>=1.6",
    "xarray>=2023.1",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "plotly>=5.18",
]

[project.optional-dependencies]
fast-raytracing = ["embreex"]
dev = ["pytest"]
city-model = ["geopandas", "shapely", "mapbox-earcut", "osmnx", "earthengine-api", "geemap", "pyproj", "fiona"]

[project.scripts]
pasa = "pasa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
